[workspace]
members = [
    "kodik-rs",
    "kodik-parser",
    "kodik-utils",
    "kodik-shiki",
    "kodik-mpv-plugin",
]
resolver = "3"

[workspace.dependencies]
# members
kodik-parser = { version = "3", path = "kodik-parser" }
kodik-shiki = { version = "0.1", path = "kodik-shiki" }
kodik-utils = { version = "0.1", path = "kodik-utils" }

# members deps
ua_generator = "0.5"
serde = "1.0"
log = "0.4"
tokio = "1.52"
serde_json = "1.0"
reqwest = "0.13"
base64 = "0.22"
lazy-regex = "3.6"
serde-saphyr = "0.0.26"
arc-swap = "1.9"
clap = "4.6"
dirs = "6.0"
thiserror = "2.0"
anyhow = "1.0"
mpv-client = { version = "1.2", package = "mpv-client-cross" }
futures = "0.3"
env_logger = "0.11"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
expect_used = "warn"
unwrap_used = "warn"
panic = "warn"
multiple_crate_versions = "allow"
mod_module_files = "warn"
module_name_repetitions = "warn"
partial_pub_fields = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_test_prefix = "warn"
str_to_string = "warn"
suspicious_xor_used_as_pow = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BatogiX/kodik"
homepage = "https://github.com/BatogiX/kodik"
documentation = "https://docs.rs/kodik-parser"
keywords = ["rust", "library", "kodik", "parser"]
categories = ["api-bindings"]
readme = "README.md"
